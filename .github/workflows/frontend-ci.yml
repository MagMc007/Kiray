name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "kiray-client/**"
      - ".github/workflows/frontend-ci.yml"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
    paths:
      - "kiray-client/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

# Cancel older pending runs of the same workflow on the same ref
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stub values for CI so Next.js build doesn't fail on missing env vars.
  # Real values live in Vercel project settings and are injected at deploy time.
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
  NEXT_PUBLIC_CLOUDINARY_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_TOKEN }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — runs on every PR and every push to main
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiray-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "kiray-client/package-lock.json"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vitest test suite
        run: npm run test

      - name: Next.js production build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # CD — deploy to Vercel (only when CI passes on push to main OR on a tag)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    # Only deploy on direct pushes to main (not on PRs).
    # Vercel's own GitHub integration handles PR preview deployments automatically.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    defaults:
      run:
        working-directory: kiray-client

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "kiray-client/package-lock.json"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & environment variables
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel (using Vercel's build pipeline)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
