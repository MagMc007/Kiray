name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "kiray-server/**"
  pull_request:
    branches:
      - main
    paths:
      - "kiray-server/**"
  workflow_dispatch:
    inputs:
      sha:
        description: "Short git SHA to roll back to (e.g. a1b2c3d). Only used by the rollback job."
        required: false
        type: string

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Jest Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiray-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "kiray-server/package-lock.json"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run Jest test suite with coverage
        run: npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage-report
          path: kiray-server/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Build Docker image and push to ACR
  docker-build:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure with Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_REGISTRY }}

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=${{ secrets.ACR_REGISTRY }}/kiray-server:latest" >> $GITHUB_OUTPUT
          echo "image_sha=${{ secrets.ACR_REGISTRY }}/kiray-server:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: kiray-server/
          file: kiray-server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_latest }}
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy new image to ACA
  deploy:
    name: Deploy to Azure Container App
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Log in to Azure with Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image revision to Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_REGISTRY }}/kiray-server:${{ needs.docker-build.outputs.image_tag }}

      - name: Print deployed image tag
        run: echo "Deployed image tag → ${{ needs.docker-build.outputs.image_tag }}"

  # Manual rollback — triggered via workflow_dispatch with a SHA input
  # Redeploys a previously pushed image from ACR without rebuilding or testing
  rollback:
    name: Rollback to SHA
    runs-on: ubuntu-latest
    # Only run when manually triggered AND a sha input was provided
    if: github.event_name == 'workflow_dispatch' && inputs.sha != ''

    environment:
      name: production

    steps:
      - name: Log in to Azure with Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll back Container App to sha-${{ inputs.sha }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_REGISTRY }}/kiray-server:sha-${{ inputs.sha }}

      - name: Print rollback target
        run: echo "Rolled back to → sha-${{ inputs.sha }}"
