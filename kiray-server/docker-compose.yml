services:
  redis:
    image: redis:7-alpine
    container_name: kiray-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiray-network

  kiray-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiray-server:${SERVER_TAG:-latest}
    container_name: kiray-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - REDIS_URL=redis://kiray-redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kiray-network

volumes:
  redis_data:
    driver: local

networks:
  kiray-network:
    driver: bridge
