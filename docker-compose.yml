services:
  redis:
    image: redis:7-alpine
    container_name: kiray-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiray-network

volumes:
  redis_data:
    driver: local

networks:
  kiray-network:
    driver: bridge
